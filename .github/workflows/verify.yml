# Tests, lint, and typecheck on every push and PR.
#
# Added after 0.16.1 shipped with 5 TypeScript errors: that change was verified
# with tests, lint, and a production build, all of which passed, because
# `nuxt build` does not typecheck. Only `pnpm typecheck` catches it, and nothing
# ran it automatically. Now something does.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The gap that let 0.16.1 ship broken: a green build is not a typecheck.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, security, and integration tests
        run: pnpm test:unit
